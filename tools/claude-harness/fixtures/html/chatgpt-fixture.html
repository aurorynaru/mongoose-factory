<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture Chat</title>
<!--
  TEST FIXTURE — NOT ChatGPT. Mimics only the DOM hooks the harness adapter relies on
  (data-message-author-role / data-message-id, #prompt-textarea, send/stop buttons,
  turn copy button, code blocks with a language header). Behaviour is selected with ?mode=:
    normal | login | ratelimit | swallow | deadsend | delayed | lateaccept | error
  and the DOM generation with ?dom=: v1 (older data-message-author-role markup, default) or
  v2 (structure observed on live chatgpt.com 2026-10-01: data-turn-key turns,
  data-content-search-unit-key units, data-chatgpt-selection-message-id, data-markdown-copy code blocks,
  "Ask ChatGPT" textbox, "Rate response"/"Regenerate response" buttons on finished replies).
  Messages persist in localStorage per conversation id to emulate server-side history.
-->
<style>
  body { font-family: sans-serif; margin: 0; }
  #thread { padding: 12px; }
  article { border-bottom: 1px solid #ddd; padding: 8px; }
  #composer-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: #fafafa; padding: 8px; }
  #prompt-textarea { min-height: 40px; border: 1px solid #888; padding: 6px; white-space: pre-wrap; }
  .text-token-text-error { color: red; }
  #banner { background: #fee; padding: 6px; }
</style>
</head>
<body>
<div id="banner-slot"></div>
<main id="thread"></main>
<div id="composer-wrap"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'normal';
  const dom = params.get('dom') || 'v1';
  const conv = (location.pathname.match(/\/c\/([^/?]+)/) || [])[1] || 'none';
  const isHome = conv === 'none';
  let KEY = 'fixture-conv-' + conv;
  const thread = document.getElementById('thread');
  const load = () => JSON.parse(localStorage.getItem(KEY) || 'null');
  const save = (m) => localStorage.setItem(KEY, JSON.stringify(m));
  let msgs = load();
  if (!msgs && isHome) msgs = []; // new-chat page: empty
  if (!msgs) {
    msgs = [
      { role: 'user', id: 'old-u1', text: 'An older question that must never be forwarded again.', hidden: false },
      { role: 'assistant', id: 'old-a1', html: '<p>An older answer. <code>OLD</code></p>', hidden: false },
    ];
    save(msgs);
  }
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let seq = Date.now() % 100000;

  let unitSeq = 0;
  function turn(m, done) {
    if (dom === 'v2') {
      const t = document.createElement('div');
      t.setAttribute('data-turn-key', 'tk-' + m.id);
      const u = document.createElement('div');
      u.setAttribute('data-content-search-unit-key', 'fallback-turn-' + (++unitSeq) + (m.role === 'user' ? ':0:user' : ':2:assistant'));
      if (m.role === 'user') u.innerHTML = '<h5 class="sr-only">You said:</h5><div class="whitespace-pre-wrap">' + esc(m.text) + '</div>';
      else u.innerHTML = '<h6 class="sr-only">ChatGPT said:</h6><div class="group" data-chatgpt-selection-message-id="' + m.id + '"><div data-markdown-text-style="assistant-message">' + (m.html || '') + '</div></div>';
      t.appendChild(u);
      if (m.role === 'assistant' && done) addCopy(t);
      return t;
    }
    const art = document.createElement('article');
    art.setAttribute('data-testid', 'conversation-turn-' + m.id);
    const el = document.createElement('div');
    el.setAttribute('data-message-author-role', m.role);
    el.setAttribute('data-message-id', m.id);
    if (m.role === 'user') el.innerHTML = '<div class="whitespace-pre-wrap">' + esc(m.text) + '</div>';
    else el.innerHTML = '<div class="markdown prose">' + (m.html || '') + '</div>';
    art.appendChild(el);
    if (m.role === 'assistant' && done) addCopy(art);
    return art;
  }
  function addCopy(art) {
    if (dom === 'v2') {
      for (const l of ['Copy', 'Rate response', 'Regenerate response']) { const b = document.createElement('button'); b.setAttribute('aria-label', l); b.textContent = l; art.appendChild(b); }
      return;
    }
    const b = document.createElement('button');
    b.setAttribute('data-testid', 'copy-turn-action-button');
    b.setAttribute('aria-label', 'Copy');
    b.textContent = 'copy';
    art.appendChild(b);
  }
  function render() {
    thread.innerHTML = '';
    for (const m of msgs) if (!m.hidden) thread.appendChild(turn(m, true));
  }

  if (mode === 'login') {
    document.getElementById('composer-wrap').innerHTML = '<button data-testid="login-button">Log in</button>';
    return;
  }
  render();
  if (mode === 'lateaccept') {
    // "server" accepted earlier submissions: reveal them now (as if the page reloaded after sync)
    let changed = false;
    for (const m of msgs) if (m.hidden) { m.hidden = false; changed = true; }
    if (changed) { save(msgs); render(); }
  }

  const wrap = document.getElementById('composer-wrap');
  wrap.innerHTML = dom === 'v2'
    ? '<div style="width:0;height:0;overflow:hidden"><div class="ProseMirror" contenteditable="true" role="textbox" aria-label="Work with ChatGPT"></div></div>' + // hidden duplicate, as seen live
      '<div class="ProseMirror" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Ask ChatGPT"></div>' +
      '<button id="send" aria-label="Send prompt">Send</button>'
    : '<div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Message the fixture"></div>' +
      '<button id="send" data-testid="send-button" aria-label="Send prompt">Send</button>';
  if (dom === 'v2') {
    // Model menu shaped like live ChatGPT (2026-10-01): effort label item, "Power" slider item
    // (Left/Right arrows), model radios. State is per page; ?effort= and ?model= set the start values.
    const efforts = ['Low', 'Medium', 'High'];
    const models = ['GPT-5.6 Sol', 'GPT-5.5'];
    let eff = Math.max(0, efforts.indexOf(params.get('effort') || 'High'));
    let mod = Math.max(0, models.indexOf(params.get('model') || 'GPT-5.6 Sol'));
    const mb = document.createElement('button');
    mb.setAttribute('aria-label', 'Select ChatGPT model');
    const paintButton = () => { mb.innerHTML = '<span>Thinking effort</span><span>' + efforts[eff] + '</span>'; };
    paintButton();
    // ?latemodel=1: the button renders after the composer, as seen live on a custom GPT's page
    if (params.get('latemodel')) setTimeout(() => wrap.appendChild(mb), 1500);
    else wrap.appendChild(mb);
    let menu = null;
    const close = () => { if (menu) { menu.remove(); menu = null; } };
    const paintMenu = () => {
      menu.innerHTML =
        '<div role="menuitem" aria-label="Select model">' + efforts[eff] + '</div>' +
        '<div role="menuitem" aria-label="Power" data-reasoning-slider="true" tabindex="-1">' +
        '<span role="slider" aria-valuemin="0" aria-valuemax="2" aria-valuenow="' + eff + '"></span></div>' +
        models.map((m, i) => '<div role="menuitemradio" aria-checked="' + (i === mod) + '" data-i="' + i + '">' + m + '</div>').join('');
      menu.querySelectorAll('[role=menuitemradio]').forEach((r) => r.addEventListener('click', () => { mod = Number(r.getAttribute('data-i')); close(); }));
      const power = menu.querySelector('[data-reasoning-slider]');
      power.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && eff < 2) eff++;
        else if (e.key === 'ArrowLeft' && eff > 0) eff--;
        else return;
        paintButton(); paintMenu(); menu.querySelector('[data-reasoning-slider]').focus();
      });
    };
    mb.addEventListener('click', () => {
      if (menu) return close();
      menu = document.createElement('div');
      menu.setAttribute('role', 'menu');
      menu.setAttribute('data-state', 'open');
      document.body.appendChild(menu);
      paintMenu();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  }
  const composer = wrap.querySelector('[contenteditable][aria-label="Ask ChatGPT"], #prompt-textarea');
  composer.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = e.clipboardData.getData('text/plain');
    composer.textContent = (composer.textContent || '') + t;
  });

  function reply(nonce) {
    const code = [
      '{',
      '  "protocol": "mongoose-harness/v1",',
      '  "nonce_seen": "' + nonce + '",',
      '  "action": "PAUSE",',
      '  "reason": "fixture <b>not</b> html"',
      '}',
    ];
    return (
      '<p>Decision for <code>' + esc(nonce) + '</code> follows.</p>' +
      '<ul><li>first point</li><li>second <strong>point</strong></li></ul>' +
      '<table><thead><tr><th>Check</th><th>Status</th></tr></thead><tbody><tr><td>AC-1</td><td>passed</td></tr></tbody></table>' +
      (dom === 'v2'
        ? '<div data-markdown-copy="code-block"><div data-markdown-copy="exclude"><svg aria-hidden="true"></svg><div class="min-w-0 flex-1 truncate">JSON</div>' +
          '<div><span><button aria-label="Enable word wrap"></button></span><span><button aria-label="Copy"></button></span></div></div>' +
          '<div class="overflow-auto"><code class="whitespace-pre! block">' +
          code.map((l) => '<span><span>' + esc(l) + '</span>\n</span>').join('') + '</code></div></div>'
        : '<pre class="overflow-visible"><div class="contain-inline-size"><div class="flex">json</div>' +
          '<div class="sticky"><button>Copy code</button></div>' +
          '<div class="overflow-y-auto"><code class="whitespace-pre language-json">' +
          code.map((l) => '<span>' + esc(l) + '\n</span>').join('') +
          '</code></div></div></pre>')
    );
  }

  function stream(nonce) {
    const stop = document.createElement('button');
    if (dom !== 'v2') stop.setAttribute('data-testid', 'stop-button');
    stop.setAttribute('aria-label', 'Stop streaming');
    stop.textContent = 'stop';
    wrap.appendChild(stop);
    document.getElementById('send').style.display = 'none';
    const id = 'a-' + (++seq);
    const full = mode === 'error'
      ? '<p>Partial answer</p><div class="text-token-text-error">Something went wrong while generating the response.</div>'
      : reply(nonce);
    const m = { role: 'assistant', id, html: '' };
    const art = turn(m, false);
    thread.appendChild(art);
    const target = art.querySelector(dom === 'v2' ? '[data-markdown-text-style]' : '.markdown');
    let i = 0;
    const steps = 8;
    const tick = setInterval(() => {
      i++;
      // grow the visible text so the adapter's stability check sees change while streaming
      target.innerHTML = i < steps ? '<p>' + 'thinking '.repeat(i) + '</p>' : full;
      if (i >= steps) {
        clearInterval(tick);
        stop.remove();
        document.getElementById('send').style.display = '';
        m.html = full;
        msgs.push(m);
        save(msgs);
        addCopy(art);
      }
    }, 150);
  }

  document.getElementById('send').addEventListener('click', () => {
    const text = composer.innerText;
    if (!text.trim()) return;
    if (mode === 'deadsend') return; // click does nothing; text stays in composer
    composer.textContent = '';
    const nonce = (text.match(/nonce=(H-[A-Za-z0-9]+)/) || [])[1] || 'none';
    const u = { role: 'user', id: 'u-' + (++seq), text };
    if (isHome && mode !== 'swallow' && mode !== 'deadsend' && !location.pathname.includes('/c/')) {
      const newId = 'fixture-new-' + (++seq);
      // like live ChatGPT: a temporary client-side id first, the real conversation id ~1 s later
      const base = location.pathname.replace(/\/$/, '');
      history.pushState({}, '', base + '/c/local-chatgpt%3A' + newId + location.search);
      setTimeout(() => history.replaceState({}, '', base + '/c/' + newId + location.search), 1000);
      KEY = 'fixture-conv-' + newId;
    }
    if (mode === 'swallow') return; // text left the composer but was never accepted
    if (mode === 'ratelimit') {
      document.getElementById('banner-slot').innerHTML = '<div id="banner" role="alert">You\'ve reached our limit of messages. Try again later.</div>';
      return;
    }
    if (mode === 'lateaccept') {
      u.hidden = true; // accepted by the "server" but not shown until reload
      msgs.push(u); save(msgs);
      return;
    }
    const show = () => { msgs.push(u); save(msgs); thread.appendChild(turn(u, true)); stream(nonce); };
    if (mode === 'delayed') setTimeout(show, 1500); else show();
  });
})();
</script>
</body>
</html>
