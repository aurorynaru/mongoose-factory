<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6fa">
<title>Service Desk</title>
<!-- Mongoose bridge (WSForm, MG). In the local preview, tools/serve.js answers this with preview/stub.js. -->
<script type="text/javascript" src="../$app/scripts/UserControl.js"></script>
<!-- ?v= changes with each install: the browser may keep an old copy otherwise (BLD-018). -->
<link rel="stylesheet" href="app.css?v=bld018">
</head>
<body>
<a class="FX_Skip" href="#FX_View">Skip to content</a>
<!-- Icons: one inline sprite, used with <svg aria-hidden="true"><use href="#i-name"/></svg>. No icon font or CDN. -->
<svg class="FX_Sprite" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-projects" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-issues" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 15h5"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.2 4.5v15M14.8 4.5v15"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4.5M6 5h11l-2 4 2 4H6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5M12 16h.01"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h4.5l1.5 2h4l1.5-2H20"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5.5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3.5v-3.5H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4.5v15h16"/><path d="m7.5 14.5 3.5-4 3 2.5 4.5-5.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19h3.5L19 8.5 15.5 5 5 15.5z"/><path d="m13.5 7 3.5 3.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></symbol>
  <symbol id="i-signout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14M10.5 12H20M16.5 8.5 20 12l-3.5 3.5"/></symbol>
  <!-- Ticket types -->
  <symbol id="i-t-incident" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-t-request" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-t-problem" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 8v5M12 16h.01"/></symbol>
  <symbol id="i-t-change" viewBox="0 0 24 24"><path d="M4.5 9h13l-3-3M19.5 15h-13l3 3"/></symbol>
  <symbol id="i-t-task" viewBox="0 0 24 24"><path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/></symbol>
</svg>

<!-- Sign-in screen (BLD-018): shown when there is no valid session for this tab; the app behind it is inert. -->
<div class="FX_Gate" id="FX_Gate" hidden>
  <section class="FX_GateCard" aria-labelledby="FX_GateTitle">
    <svg class="FX_BrandMark" aria-hidden="true"><use href="#i-mark"/></svg>
    <h1 id="FX_GateTitle">Sign in to Service Desk</h1>
    <p id="FX_GateText">Sign in to see and work on tickets.</p>
    <button type="button" class="FX_Btn FX_Btn--primary" id="FX_GateSignIn">Open the sign-in page</button>
    <button type="button" class="FX_Btn" id="FX_GateRetry">I've signed in, load tickets</button>
    <p class="FX_GateNote" id="FX_GateNote" role="status" aria-live="polite"></p>
  </section>
</div>

<div class="FX_App" id="FX_App">
  <aside class="FX_Side" id="FX_Side" aria-label="Main">
    <div class="FX_Brand">
      <svg class="FX_BrandMark" aria-hidden="true"><use href="#i-mark"/></svg>
      <span class="FX_BrandName">Service Desk</span>
      <button type="button" class="FX_IconBtn FX_SideClose" id="FX_SideClose" aria-label="Close menu"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <nav class="FX_Nav" aria-label="Views">
      <a href="#work" data-view="work" title="My work"><svg aria-hidden="true"><use href="#i-work"/></svg><span>My work</span></a>
      <a href="#projects" data-view="projects" title="Projects"><svg aria-hidden="true"><use href="#i-projects"/></svg><span>Projects</span></a>
      <a href="#issues" data-view="issues" title="Issues"><svg aria-hidden="true"><use href="#i-issues"/></svg><span>Issues</span><b class="FX_Count" id="FX_OpenCount"></b></a>
      <a href="#board" data-view="board" title="Board"><svg aria-hidden="true"><use href="#i-board"/></svg><span>Board</span></a>
      <a href="#dashboard" data-view="dashboard" title="Dashboard"><svg aria-hidden="true"><use href="#i-chart"/></svg><span>Dashboard</span></a>
    </nav>
    <section class="FX_SideProjects" aria-labelledby="FX_YourProjects">
      <h2 id="FX_YourProjects">Your projects</h2>
      <ul id="FX_ProjectList"></ul>
    </section>
    <div class="FX_Me" id="FX_Me"></div>
  </aside>
  <div class="FX_Scrim" id="FX_Scrim" hidden></div>

  <div class="FX_Main">
    <header class="FX_Top">
      <button type="button" class="FX_IconBtn FX_MenuBtn" id="FX_MenuBtn" aria-label="Open menu" aria-controls="FX_Side" aria-expanded="false"><svg aria-hidden="true"><use href="#i-menu"/></svg></button>
      <nav class="FX_Crumbs" aria-label="Breadcrumb"><span>Service Desk</span><span aria-hidden="true">/</span><b id="FX_Crumb">My work</b></nav>
      <form class="FX_Search" id="FX_SearchForm" role="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <label class="FX_Sr" for="FX_SearchBox">Search tickets</label>
        <input id="FX_SearchBox" name="q" type="search" placeholder="Search by ticket ID or summary…" autocomplete="off" spellcheck="false">
      </form>
      <button type="button" class="FX_Ghost" id="FX_Refresh" aria-label="Refresh" title="Refresh"><svg aria-hidden="true"><use href="#i-refresh"/></svg><span>Refresh</span></button>
      <button type="button" class="FX_Btn FX_CreateBtn" id="FX_CreateBtn" aria-haspopup="dialog" aria-label="Create issue" title="Create issue"><svg aria-hidden="true"><use href="#i-plus"/></svg><span>Create issue</span></button>
      <span class="FX_Avatar FX_Avatar--top" id="FX_TopAvatar" aria-hidden="true"></span>
    </header>
    <p class="FX_Status" id="FX_Status" role="status" aria-live="polite"></p>
    <main class="FX_View" id="FX_View" tabindex="-1"></main>
  </div>
</div>

<!-- Move a ticket with the keyboard (board "Move to…" and the same for any card) -->
<div class="FX_Menu" id="FX_MoveMenu" role="menu" hidden></div>

<!-- Create issue: app.js fills the form each time it opens -->
<dialog class="FX_Dialog" id="FX_CreateDialog" aria-labelledby="FX_CreateTitle"></dialog>

<!-- Moving to Resolved asks for a Resolution first -->
<dialog class="FX_Dialog FX_Dialog--small" id="FX_ResolveDialog" aria-labelledby="FX_ResolveTitle">
  <form class="FX_DialogForm" novalidate>
    <div class="FX_DialogHead"><h2 id="FX_ResolveTitle">Resolve</h2></div>
    <div class="FX_DialogBody">
      <div class="FX_Field">
        <label for="FX_ResolvePick">Resolution <i>required</i></label>
        <select id="FX_ResolvePick" name="resolution" class="FX_Select" aria-describedby="FX_ResolveError"></select>
        <p class="FX_FieldError" id="FX_ResolveError" aria-live="polite"></p>
      </div>
    </div>
    <div class="FX_DialogFoot"><button type="button" class="FX_Ghost" id="FX_ResolveCancel">Cancel</button><button type="submit" class="FX_Btn">Resolve</button></div>
  </form>
</dialog>

<script src="app.js?v=bld018c"></script>
</body>
</html>
