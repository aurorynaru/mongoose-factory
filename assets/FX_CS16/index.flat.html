<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 1.6 Global Strike</title>
<!-- Mongoose bridge (WSForm, MG). In the local preview, tools/serve.js answers this with preview/stub.js. -->
<script type="text/javascript" src="../$app/scripts/UserControl.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="FX_Page">
<header class="FX_Head">
<h1>CS 1.6 — Global Strike</h1>
<button type="button" id="FX_Reload">Restart game</button>
</header>
<p id="FX_Status" role="status">Starting…</p>
<div class="FX_GameWrap">
<iframe id="FX_Game" title="CS 1.6 game" allow="autoplay; fullscreen; pointer-lock"></iframe>
</div>
<section class="FX_Card">
<h2>Play with friends</h2>
<p>Ask your friends to open the <b>FX_CS16Portal</b> form from their Mongoose menu. Everyone who joins the same server room plays together. The first launch downloads about 278 MB of game data; after that it starts quickly.</p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
