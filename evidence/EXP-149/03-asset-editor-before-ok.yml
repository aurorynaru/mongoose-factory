- textbox [active] [ref=f15e852]: "<!DOCTYPE html> <html lang=\"en\"> <head> <meta charset=\"utf-8\"> <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> <title>FX API Page</title> <script type=\"text/javascript\" src=\"../$app/scripts/UserControl.js\"></script> <style> body{margin:0;padding:16px;font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1f2a37;background:#f5f7fa} h1{font-size:18px;margin:0 0 12px} .FX_ApiButtons button{font:inherit;padding:8px 14px;margin:0 8px 8px 0;border:0;border-radius:4px;background:#0072ed;color:#fff;cursor:pointer} .FX_ApiButtons button:disabled{background:#8aa4c2;cursor:default} #FX_ApiStatus{margin:4px 0 8px;color:#4b5563} #FX_ApiStatus.FX_Error{color:#b42318} #FX_ApiResult{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px solid #d0d7e2;border-radius:4px;padding:10px;min-height:80px;margin:0} </style> </head> <body> <h1>FX API page (JS to C# to API)</h1> <div class=\"FX_ApiButtons\"> <button type=\"button\" id=\"FX_BtnIon\" data-method=\"FX_CallIonHello\">Call ION helloworld</button> <button type=\"button\" id=\"FX_BtnHttp\" data-method=\"FX_CallHttpbin\">Call httpbin</button> </div> <div id=\"FX_ApiStatus\" role=\"status\">Ready.</div> <pre id=\"FX_ApiResult\"></pre> <script type=\"text/javascript\"> (function () { var buttons = document.querySelectorAll(\".FX_ApiButtons button\"); var statusLine = document.getElementById(\"FX_ApiStatus\"); var result = document.getElementById(\"FX_ApiResult\"); var timer = null; function setStatus(text, isError) { statusLine.textContent = text; statusLine.className = isError ? \"FX_Error\" : \"\"; } function setBusy(busy) { Array.prototype.forEach.call(buttons, function (b) { b.disabled = busy; }); } function call(method) { if (typeof WSForm === \"undefined\") { setStatus(\"Open this page inside the FX_ApiProbe Form to call the API.\", true); return; } setBusy(true); result.textContent = \"\"; setStatus(\"Calling \" + method + \"...\"); timer = setTimeout(function () { setBusy(false); setStatus(\"No response from \" + method + \" after 20 s.\", true); }, 20000); WSForm.invoke(method, function () { WSForm.getVarValue(\"FX_vApiResult\", function (value) { clearTimeout(timer); setBusy(false); setStatus(\"Done: \" + method + \" at \" + new Date().toLocaleTimeString()); result.textContent = value || \"(empty)\"; }); }); } Array.prototype.forEach.call(buttons, function (b) { b.addEventListener(\"click\", function () { call(b.getAttribute(\"data-method\")); }); }); })(); </script> </body> </html>"