qty = el(\"span\", \"FX_InvQty\", formatNumber(item.qty)); qty.appendChild(el(\"small\", \"\", \"reorder at \" + formatNumber(item.reorder))); level.appendChild(gauge); level.appendChild(qty); tdLevel.appendChild(level); var tdStatus = el(\"td\"); tdStatus.appendChild(el(\"span\", \"FX_InvBadge is-\" + item.key, STATUS[item.key].label)); [tdItem, tdWhere, tdLevel, tdStatus].forEach(function (td) { tr.appendChild(td); }); tableBody.appendChild(tr); }); if (animate) { tableBody.offsetWidth; requestAnimationFrame(function () { tableBody.classList.add(\"is-ready\"); }); } else { tableBody.classList.add(\"is-ready\"); } } function render(json) { var rows = JSON.parse(json || \"[]\"); items = rows.map(toItem); summarize(); renderRows(true); var now = new Date(); setStatus(\"Loaded \" + items.length + \" records at \" + now.toLocaleTimeString([], { hour: \"2-digit\", minute: \"2-digit\" })); } function finishLoad() { clearTimeout(loadTimer); refreshButton.disabled = false; refreshButton.removeAttribute(\"aria-busy\"); } function load() { if (typeof WSForm === \"undefined\") { setStatus(\"Open this page inside the FX_InventoryDashboard Form to load stock.\", true); return; } refreshButton.disabled = true; refreshButton.setAttribute(\"aria-busy\", \"true\"); setStatus(\"Loading...\"); loadTimer = setTimeout(function () { finishLoad(); setStatus(\"No response from FX_LoadInventoryFromIDO. Refresh to try again.\", true); }, 20000); WSForm.invoke(\"FX_LoadInventoryFromIDO\", function () { WSForm.getVarValue(\"FX_vInventoryJson\", function (value) { finishLoad(); try { render(value); } catch (e) { setStatus(\"Could not read inventory data. Refresh to try again.\", true); } }); }); } refreshButton.addEventListener(\"click\", load); function setFilter(filter) { view.filter = filter; Array.prototype.forEach.call(document.querySelectorAll(\".FX_InvFilters button\"), function (button) { button.setAttribute(\"aria-pressed\", button.getAttribute(\"data-filter\") === filter ? \"true\" :